name: build-wasmdsp

# Builds CardinalWasmDSP.{js,wasm} using the Nix FHS sandbox (flake.nix
# at the repo root). Nix provides a reproducible toolchain that matches
# the environment CardinalWasmDSP was developed against; earlier apt-based
# attempts hit "em++: no input files" during Surge/JUCE build, apparently
# due to Ubuntu-vs-emsdk environment quirks Nix's pinned deps sidestep.
#
# Pushes to cardinal-wasm-dsp branch → workflow artifact (90d retention).
# Pushing a `wasmdsp-v*` tag → GitHub Release with the .js/.wasm attached.

on:
  push:
    branches: [cardinal-wasm-dsp]
    tags: ['wasmdsp-v*']
  workflow_dispatch:

env:
  CACHE_VERSION: 2
  PAWPAW_FAST_MATH: 1
  PAWPAW_SKIP_GLIB: 1
  PAWPAW_SKIP_LTO: 1
  PAWPAW_SKIP_LV2: 1
  PAWPAW_SKIP_OPENSSL: 1
  PAWPAW_SKIP_SAMPLERATE: 1
  PAWPAW_SKIP_TESTS: 1

jobs:
  wasmdsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox-fallback = false

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache PawPaw wasm build tree
        id: cache-pawpaw
        uses: actions/cache@v4
        with:
          # PawPaw defaults to ~/PawPawBuilds; on runners HOME=/home/runner.
          path: |
            ~/PawPawBuilds
            src/Rack/dep/bin
            src/Rack/dep/include
            src/Rack/dep/lib
            src/Rack/dep/share
            src/Rack/dep/jansson-2.12
            src/Rack/dep/libarchive-3.4.3
            src/Rack/dep/libsamplerate-0.1.9
            src/Rack/dep/zstd-1.4.5
          key: wasmdsp-pawpaw-nix-v${{ env.CACHE_VERSION }}

      - name: Bootstrap PawPaw wasm dependencies (Nix FHS)
        if: steps.cache-pawpaw.outputs.cache-hit != 'true'
        run: |
          nix run . -- bash -c '
            set -euo pipefail
            ./deps/PawPaw/bootstrap-cardinal.sh wasm
            ./deps/PawPaw/.cleanup.sh wasm
          '

      - name: Patch emsdk (bulk-memory-opt whitelist)
        run: |
          nix run . -- python3 src/CardinalWasmDSP/scripts/patch-emsdk.py

      - name: Patch Surge for Emscripten
        run: |
          # Cardinal's own CI applies this same sed as a "FIXME send patch upstream"
          # (see .github/workflows/build.yml, wasm job).
          sed -i -e 's/defined(__riscv)/defined(__riscv) || defined(__EMSCRIPTEN__)/' \
            plugins/surgext/surge/src/common/globals.h

      - name: Build Cardinal libraries (Nix FHS)
        run: |
          nix run . -- bash -c '
            set -euo pipefail
            source deps/PawPaw/local.env wasm
            # Only the .a files CardinalWasmDSP links against.
            make HAVE_LIBLO=false -j"$(nproc)" carla deps dgl mini-plugins mini-resources
            test -f src/rack-headless.a
            test -f plugins/plugins-mini-headless.a
          '

      - name: Build CardinalWasmDSP (Nix FHS)
        run: |
          nix run . -- bash -c '
            set -euo pipefail
            source deps/PawPaw/local.env wasm
            make -C src/CardinalWasmDSP -j"$(nproc)"
          '
          du -h bin-wasmdsp/CardinalWasmDSP.*

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardinalWasmDSP
          path: |
            bin-wasmdsp/CardinalWasmDSP.js
            bin-wasmdsp/CardinalWasmDSP.wasm
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/wasmdsp-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin-wasmdsp/CardinalWasmDSP.js
            bin-wasmdsp/CardinalWasmDSP.wasm
          generate_release_notes: true
          fail_on_unmatched_files: true
